name: CI Pipeline

on:
  push:
    branches: [ main, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,ml,space]

      - name: Run Pytest Unit Test Suite with Coverage
        run: |
          pytest --cov=src/hf_core_lab tests/unit/ --cov-report=term-missing

      - name: Verify CLI Discovery Command Execution
        run: |
          python examples/model_discovery.py --query text-classification --limit 3
