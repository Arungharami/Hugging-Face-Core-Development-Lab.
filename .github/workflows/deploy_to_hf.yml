name: Deploy & Sync to Hugging Face Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Sync Gradio Space to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        if: ${{ env.HF_TOKEN != '' }}
        run: |
          python -c "from hf_core_lab.hub.sync import HubSyncManager; manager = HubSyncManager(); manager.sync_space(space_id='arun-gharami/fraud-risk-intelligence')"
